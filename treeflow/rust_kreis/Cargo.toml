[package]
name = "treeflow_rust"
version = "0.1.0"
edition = "2021"
description = "Schnelle Teile von treeflow in Rust (optional, Python faellt ohne zurueck)"
license = "MIT"

[lib]
name = "treeflow_rust"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.23", features = ["extension-module", "abi3-py39"] }
numpy = "0.23"

[profile.release]
opt-level = 3
lto = true
