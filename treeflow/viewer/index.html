<title>Tree Layer</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: full-bleed 3D scene; control panel top-left, tree passport right, both floating. Stacks on phones. */
:root{
  --bg:#E9EDE6; --scene:#DCE3D9; --panel:#FBFCFA; --fg:#17201B; --muted:#4C5A52; --line:#C9D2CB;
  --accent:#C2561A; --chip:#EEF2EC; --good:#2F6B47;
  --f-ui:'Barlow', 'Segoe UI', system-ui, sans-serif; --f-head:'Barlow Condensed', 'Arial Narrow', sans-serif;
  --f-data:'IBM Plex Mono', ui-monospace, Consolas, monospace;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --bg:#0F1412; --scene:#141B18; --panel:#19211E; --fg:#E3EAE5; --muted:#A2B1A9; --line:#2C3833; --accent:#F0874B; --chip:#222C28; --good:#7CC497; color-scheme:dark } }
:root[data-theme="dark"]{ --bg:#0F1412; --scene:#141B18; --panel:#19211E; --fg:#E3EAE5; --muted:#A2B1A9; --line:#2C3833; --accent:#F0874B; --chip:#222C28; --good:#7CC497; color-scheme:dark }
html,body{height:100%}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--fg);font-family:var(--f-ui);font-size:14px;overflow:hidden}
#scene{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:pointer}
.box{position:fixed;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:14px;display:flex;flex-direction:column;gap:10px;box-shadow:0 4px 18px rgba(0,0,0,.08)}
.panel{top:calc(12px + env(safe-area-inset-top,0px));left:max(16px, env(safe-area-inset-left,0px));width:min(310px,calc(100vw - 32px));max-height:calc(100% - 24px);overflow:auto}
.card{top:calc(12px + env(safe-area-inset-top,0px));right:max(16px, env(safe-area-inset-right,0px));width:min(330px,calc(100vw - 32px));max-height:calc(100% - 24px);overflow:auto}
h1{margin:0;font:600 26px/1 var(--f-head);letter-spacing:.01em;text-transform:uppercase}
h2{margin:0;font:600 22px/1 var(--f-head)}
.lab{font:500 11px var(--f-data);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.sub{margin:0;color:var(--muted);font-size:13px;line-height:1.4}
select,.btn{min-height:38px;border:1px solid var(--line);background:var(--chip);color:var(--fg);font:500 14px var(--f-ui);border-radius:6px;padding:0 10px;cursor:pointer}
select{width:100%}
.seg{display:flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.seg button{flex:1;min-height:36px;border:0;background:var(--chip);color:var(--fg);font:500 13px var(--f-ui);cursor:pointer;padding:0 6px}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--fg);color:var(--bg)}
button:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:5px 12px}
dt{color:var(--muted)} dd{margin:0;text-align:right;font-family:var(--f-data);font-size:13px;font-variant-numeric:tabular-nums}
.legend{display:flex;flex-direction:column;gap:4px;font-size:12px}
.legend .bar{height:8px;border-radius:3px}
.legend .ends{display:flex;justify-content:space-between;font-family:var(--f-data);font-size:11px;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:6px 10px}
.chips span{display:inline-flex;align-items:center;gap:5px}
.chips i{width:11px;height:11px;border-radius:2px;display:inline-block}
.tag{font:500 11px var(--f-data);padding:2px 7px;border-radius:99px;border:1px solid var(--line)}
.tag.m{border-color:var(--good);color:var(--good)}
.note{font-size:12px;color:var(--muted);line-height:1.45;margin:0}
.x{position:absolute;right:8px;top:8px;width:34px;height:34px;border:0;background:transparent;color:var(--muted);font-size:18px;cursor:pointer}
.status{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(12px + env(safe-area-inset-bottom,0px));font:12px var(--f-data);color:var(--muted);background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:4px 10px;white-space:nowrap}
@media (max-width:760px){
  .panel{max-height:44%}
  .card{top:auto;bottom:calc(46px + env(safe-area-inset-bottom,0px));max-height:46%}
}
</style>

<canvas id="scene" aria-label="3D view of the trees. Drag to rotate, scroll to zoom, click a tree for its values." role="img"></canvas>

<section class="box panel" aria-label="Controls">
  <div class="lab">Already segmented trees, as a 3D layer</div>
  <h1>Tree Layer</h1>
  <label class="lab" for="site">Site</label>
  <select id="site"></select>
  <p class="sub" id="siteInfo">Loading …</p>
  <div class="lab">Colour by</div>
  <select id="colorBy" aria-label="Colour by"></select>
  <div class="legend" id="legend"></div>
  <div class="lab">Show</div>
  <div class="seg" role="group" aria-label="Show">
    <button id="sCrowns" aria-pressed="true">Crowns</button>
    <button id="sStems" aria-pressed="true">Stems</button>
    <button id="sPts" aria-pressed="true">Points</button>
  </div>
  <button class="btn" id="reset">Reset view</button>
  <p class="note">Each tree is rebuilt from its own points: crown as rings at six heights in twelve directions, stem from circle fits where the scan shows it. Points appear for the tree you open.</p>
</section>

<section class="box card" id="card" hidden aria-live="polite">
  <button class="x" id="close" aria-label="Close tree passport">✕</button>
  <div class="lab">Tree passport</div>
  <h2 id="cTitle">–</h2>
  <div id="cTags" class="chips"></div>
  <dl id="cVals"></dl>
  <div id="cStem"></div>
  <p class="note" id="cNote"></p>
</section>

<div class="status" id="status">Loading …</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>
"use strict";
const $ = id => document.getElementById(id);
const fmt = (v, d=1) => (v==null||Number.isNaN(v)) ? '–' : Number(v).toLocaleString('en-GB',{minimumFractionDigits:d,maximumFractionDigits:d});
const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();

// ---------- scene ----------
const canvas = $('scene');
const renderer = new THREE.WebGLRenderer({ canvas, antialias:true });
renderer.setPixelRatio(Math.min(devicePixelRatio||1, 1.75));
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(45, 1, 0.5, 20000);
const controls = new THREE.OrbitControls(camera, canvas);
controls.enableDamping = true; controls.maxPolarAngle = Math.PI*0.49; controls.screenSpacePanning = false;
scene.add(new THREE.HemisphereLight(0xffffff, 0x4a4a3a, 0.85));
const sun = new THREE.DirectionalLight(0xfff1dc, 0.8); sun.position.set(-60, 120, 40); scene.add(sun);

let INDEX=null, SITE=null, ORIGIN=null, ZBASE=0, trees=[], groups={}, terrainMesh=null, ptsObj=null, sel=null;
const show = { crowns:true, stems:true, pts:true };

// world: x = east - origin, y = up (elevation - zbase), z = -(north - origin)
const W = (e, n, up) => new THREE.Vector3(e-ORIGIN.x, up-ZBASE, -(n-ORIGIN.y));

// ---------- colour modes ----------
const RAMP = ['#2F5D50','#4E8456','#86A85A','#C9B54A','#E08E3C'].map(c=>new THREE.Color(c));
function ramp(t){ t=Math.max(0,Math.min(1,t))*(RAMP.length-1); const i=Math.min(RAMP.length-2,Math.floor(t)); return RAMP[i].clone().lerp(RAMP[i+1], t-i); }
const CAT = ['#3D7A55','#C2561A','#3B6EA5','#A0843A','#7C5BA6','#3F8C8C','#B04A6B','#6B6B6B'].map(c=>new THREE.Color(c));
let modes = {};
function buildModes(){
  modes = {};
  if(SITE.has_colour) modes.scan = { label:'Real colour (drone camera)', rgb:true };
  Object.assign(modes, {
    height:{ label:'Height', num:t=>t.h, unit:'m' },
    crown:{ label:'Crown width', num:t=>t.cw, unit:'m' },
    stem:{ label:'Stem: measured or not', cat:t=>t.dbh!=null?'measured':'not measured' }
  });
  for(const f of (SITE.extra_fields||[])){
    const vals = trees.map(t=>t[f]).filter(v=>v!=null);
    if(!vals.length) continue;
    if(vals.every(v=>typeof v==='number')) modes['x_'+f] = { label:f, num:t=>t[f], unit:'' };
    else if(new Set(vals).size<=8) modes['x_'+f] = { label:f, cat:t=>t[f]??'–' };
  }
  const sel = $('colorBy'), cur = sel.value;
  sel.innerHTML = Object.entries(modes).map(([k,m])=>`<option value="${k}">${m.label}</option>`).join('');
  sel.value = modes[cur] ? cur : (modes.scan ? 'scan' : 'height');
}
function colourFn(){
  const m = modes[$('colorBy').value] || modes.height;
  if(m.rgb){
    $('legend').innerHTML = '<p class="note">Each crown has the median colour of its upper points, as the drone camera saw them.</p>';
    return t => t.rgb ? new THREE.Color(t.rgb).multiplyScalar(0.85) : new THREE.Color('#9a9a9a');
  }
  if(m.num){
    const v = trees.map(m.num).filter(x=>x!=null).sort((a,b)=>a-b);
    const lo = v[Math.floor(v.length*0.02)]??0, hi = v[Math.floor(v.length*0.98)]??1;
    $('legend').innerHTML = `<div class="bar" style="background:linear-gradient(90deg,${RAMP.map(c=>'#'+c.getHexString()).join(',')})"></div><div class="ends"><span>${fmt(lo)} ${m.unit}</span><span>${m.label}</span><span>${fmt(hi)} ${m.unit}</span></div>`;
    return t => { const x=m.num(t); return x==null ? new THREE.Color('#9a9a9a') : ramp((x-lo)/Math.max(1e-6,hi-lo)); };
  }
  const cats = [...new Set(trees.map(m.cat))].sort();
  $('legend').innerHTML = '<div class="chips">'+cats.map((c,i)=>`<span><i style="background:#${CAT[i%CAT.length].getHexString()}"></i>${c}</span>`).join('')+'</div>';
  return t => CAT[cats.indexOf(m.cat(t))%CAT.length].clone();
}

// ---------- geometry ----------
function crownInto(t, col, P, C, I, F, ti){
  const [L,K] = SITE.rings; const r = t.rings;
  const c0 = W(t.x, t.y, t.g);
  const base = P.length/3;
  const y0 = t.g + t.cb, y1 = t.g + t.h, dh = (y1-y0)/L;
  const push = (x,y,z)=>{ P.push(x,y,z); C.push(col.r,col.g,col.b); };
  push(c0.x, y1-ZBASE, c0.z);
  for(let l=L-1;l>=0;l--){ const y=y0+(l+0.5)*dh-ZBASE; for(let k=0;k<K;k++){ const a=(k+0.5)/K*2*Math.PI-Math.PI, rr=r[l*K+k]/10; push(c0.x+Math.cos(a)*rr, y, c0.z-Math.sin(a)*rr); } }
  push(c0.x, y0-ZBASE, c0.z);
  const ring = l => base+1+l*K, bottom = base+1+L*K;
  const tri=(a,b,c)=>{ I.push(a,b,c); F.push(ti); };
  for(let k=0;k<K;k++) tri(base, ring(0)+k, ring(0)+(k+1)%K);
  for(let l=0;l<L-1;l++) for(let k=0;k<K;k++){ const a=ring(l)+k,b=ring(l)+(k+1)%K,c=ring(l+1)+k,d=ring(l+1)+(k+1)%K; tri(a,c,b); tri(b,c,d); }
  for(let k=0;k<K;k++) tri(bottom, ring(L-1)+(k+1)%K, ring(L-1)+k);
}
function stemInto(t, P, C, I, F, ti){
  // measured profile where available, then tapering to 70 % of the height (drawn lighter = estimated)
  const meas = (t.stem||[]).map(s=>[s[0], s[1]/100]);
  const est = Math.max(0.06, (t.dbh ? t.dbh/200 : 0.006*t.h+0.05));
  const prof = meas.length ? [[0, meas[0][1]*1.05], ...meas] : [[0, est]];
  const topZ = Math.max(t.cb + 0.3*(t.h-t.cb), (prof[prof.length-1][0]+0.5));
  prof.push([topZ, 0.02]);
  const c0 = W(t.x, t.y, t.g), S = 6;
  const brown = new THREE.Color(meas.length ? '#6B4426' : '#9C8670');
  let prev = null;
  for(const [z, r] of prof){
    const start = P.length/3;
    for(let s=0;s<S;s++){ const a=s/S*2*Math.PI; P.push(c0.x+Math.cos(a)*r, t.g+z-ZBASE, c0.z+Math.sin(a)*r); C.push(brown.r,brown.g,brown.b); }
    if(prev!==null) for(let s=0;s<S;s++){ const a=prev+s,b=prev+(s+1)%S,c=start+s,d=start+(s+1)%S; I.push(a,b,c, b,d,c); F.push(ti,ti); }
    prev = start;
  }
}
function meshFrom(P,C,I,F, mat){
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(P,3));
  g.setAttribute('color', new THREE.Float32BufferAttribute(C,3));
  g.setIndex(I); g.computeVertexNormals();
  const m = new THREE.Mesh(g, mat); m.userData.faceTree = Int32Array.from(F); return m;
}
const crownMat = new THREE.MeshLambertMaterial({ vertexColors:true, side:THREE.DoubleSide });
const stemMat = new THREE.MeshLambertMaterial({ vertexColors:true });

function rebuild(){
  for(const k in groups){ scene.remove(groups[k]); groups[k].traverse(o=>{ if(o.geometry) o.geometry.dispose(); }); }
  groups = {};
  const col = colourFn();
  const crowns = new THREE.Group(), stems = new THREE.Group();
  // one merged mesh per tile keeps thousands of trees fast
  const byTile = {};
  trees.forEach((t,i)=>{ (byTile[t._tile] ||= []).push(i); });
  for(const key in byTile){
    let P=[],C=[],I=[],F=[], sP=[],sC=[],sI=[],sF=[];
    for(const i of byTile[key]){
      const t = trees[i];
      const c = sel===t ? new THREE.Color(css('--accent')||'#C2561A') : col(t);
      if(t.rings) crownInto(t, c, P, C, I, F, i);
      stemInto(t, sP, sC, sI, sF, i);
    }
    if(I.length) crowns.add(meshFrom(P,C,I,F, crownMat));
    if(sI.length) stems.add(meshFrom(sP,sC,sI,sF, stemMat));
  }
  crowns.visible = show.crowns; stems.visible = show.stems;
  scene.add(crowns); scene.add(stems); groups = { crowns, stems };
}

function buildTerrain(T){
  if(terrainMesh){ scene.remove(terrainMesh); terrainMesh.geometry.dispose(); }
  const g = new THREE.PlaneGeometry((T.nx-1)*T.step, (T.ny-1)*T.step, T.nx-1, T.ny-1);
  g.rotateX(-Math.PI/2);
  const p = g.attributes.position; const cols = [];
  // plane vertex order: rows from +z (north side after rotation) … build by matching coordinates
  for(let i=0;i<p.count;i++){
    const e = p.getX(i) + T.x0 + (T.nx-1)*T.step/2, n = -p.getZ(i) + T.y0 + (T.ny-1)*T.step/2;
    const cx = Math.min(T.nx-1, Math.max(0, Math.round((e-T.x0)/T.step))), cy = Math.min(T.ny-1, Math.max(0, Math.round((n-T.y0)/T.step)));
    p.setY(i, T.z[cy*T.nx+cx] - ZBASE - 0.05);
    if(T.c){ const v = T.c[cy*T.nx+cx]; cols.push(((v>>16)&255)/255*0.8, ((v>>8)&255)/255*0.8, (v&255)/255*0.8); }
  }
  if(T.c) g.setAttribute('color', new THREE.Float32BufferAttribute(cols,3));
  g.translate(T.x0 + (T.nx-1)*T.step/2 - ORIGIN.x, 0, -(T.y0 + (T.ny-1)*T.step/2 - ORIGIN.y));
  g.computeVertexNormals();
  terrainMesh = new THREE.Mesh(g, T.c ? new THREE.MeshLambertMaterial({ vertexColors:true })
                                      : new THREE.MeshLambertMaterial({ color: new THREE.Color('#7E806A') }));
  scene.add(terrainMesh);
}

// ---------- loading ----------
async function getJSON(p){ const r = await fetch(p); if(!r.ok) throw new Error(p+' '+r.status); return r.json(); }
const ptsCache = {};
async function loadSite(id){
  SITE = INDEX.sites.find(s=>s.id===id); sel=null; $('card').hidden=true; clearPts();
  $('status').textContent = 'Loading trees …';
  const T = await getJSON(`data/${id}/terrain.json`);
  const tiles = await Promise.all(SITE.tiles.map(tl=>getJSON(`data/${id}/tile_${tl.i}_${tl.j}.json`).then(d=>d.trees.map(t=>({...t,_tile:tl.i+'_'+tl.j})))));
  trees = tiles.flat();
  const xs = trees.map(t=>t.x), ys = trees.map(t=>t.y);
  ORIGIN = { x:(Math.min(...xs)+Math.max(...xs))/2, y:(Math.min(...ys)+Math.max(...ys))/2 };
  ZBASE = Math.min(...T.z);
  buildTerrain(T); buildModes(); rebuild(); resetView();
  const meas = trees.filter(t=>t.dbh!=null).length;
  const w = Math.max(...xs)-Math.min(...xs), h = Math.max(...ys)-Math.min(...ys);
  $('siteInfo').innerHTML = `${SITE.title}<br>${trees.length.toLocaleString('en-GB')} trees · ${fmt(w,0)} × ${fmt(h,0)} m · stems measured: ${meas.toLocaleString('en-GB')} · ${fmt(SITE.density,0)} points/m² · trees from ${SITE.trees_from}`;
  $('status').textContent = trees.length.toLocaleString('en-GB') + ' trees loaded';
}
function resetView(){
  const xs = trees.map(t=>t.x), ys = trees.map(t=>t.y);
  const s = Math.max(Math.max(...xs)-Math.min(...xs), Math.max(...ys)-Math.min(...ys), 30);
  const hz = trees.reduce((a,t)=>a+t.h,0)/Math.max(1,trees.length)*0.5;
  camera.position.set(-s*0.55, s*0.65, s*0.85); controls.target.set(0, hz, 0); controls.update();
}

// ---------- picking + passport ----------
const ray = new THREE.Raycaster(), ptr = new THREE.Vector2(); let down=null;
canvas.addEventListener('pointerdown', e=>{ down=[e.clientX,e.clientY]; });
canvas.addEventListener('pointerup', e=>{
  if(!down || Math.hypot(e.clientX-down[0], e.clientY-down[1])>5){ down=null; return; } down=null;
  const r = canvas.getBoundingClientRect();
  ptr.set((e.clientX-r.left)/r.width*2-1, -(e.clientY-r.top)/r.height*2+1);
  ray.setFromCamera(ptr, camera);
  const objs = []; for(const k in groups) if(groups[k].visible) objs.push(...groups[k].children);
  const hit = ray.intersectObjects(objs, false)[0];
  select(hit ? trees[hit.object.userData.faceTree[hit.faceIndex]] : null);
});
function clearPts(){ if(ptsObj){ scene.remove(ptsObj); ptsObj.geometry.dispose(); ptsObj=null; } }
async function showPts(t){
  clearPts(); if(!show.pts || !t) return;
  const key = SITE.id+'/'+t._tile;
  ptsCache[key] ||= getJSON(`data/${SITE.id}/pts_${t._tile}.json`);
  const all = await ptsCache[key]; const e = all[String(t.id)]; if(!e || sel!==t) return;
  const a = Array.isArray(e) ? e : e.p, pc = Array.isArray(e) ? null : e.c;
  const c0 = W(t.x, t.y, t.g), pos=[], col=[];
  for(let i=0;i<a.length;i+=3) pos.push(c0.x + a[i]/10, t.g + a[i+1]/10 - ZBASE, c0.z - a[i+2]/10);
  if(pc) for(const v of pc) col.push(((v>>16)&255)/255, ((v>>8)&255)/255, (v&255)/255);
  const g = new THREE.BufferGeometry(); g.setAttribute('position', new THREE.Float32BufferAttribute(pos,3));
  if(pc) g.setAttribute('color', new THREE.Float32BufferAttribute(col,3));
  ptsObj = new THREE.Points(g, pc ? new THREE.PointsMaterial({ vertexColors:true, size:0.3 })
                                  : new THREE.PointsMaterial({ color: new THREE.Color(css('--fg')||'#17201B'), size:0.25 }));
  scene.add(ptsObj);
}
function stemSvg(t){
  if(!t.stem || !t.stem.length) return '';
  const W_=290, H_=110, zs=t.stem.map(s=>s[0]), rs=t.stem.map(s=>s[1]);
  const zmax=Math.max(...zs)+0.5, rmax=Math.max(...rs)*1.15;
  const X=r=>W_/2+r/rmax*(W_/2-30), Y=z=>H_-16-z/zmax*(H_-26);
  const right=t.stem.map(s=>`${X(s[1]).toFixed(1)},${Y(s[0]).toFixed(1)}`).join(' ');
  const left=t.stem.slice().reverse().map(s=>`${(W_-X(s[1])).toFixed(1)},${Y(s[0]).toFixed(1)}`).join(' ');
  return `<div class="lab" style="margin-top:4px">Measured stem profile</div><svg viewBox="0 0 ${W_} ${H_}" width="100%" role="img" aria-label="Stem diameter from ${fmt(zs[0])} to ${fmt(zs[zs.length-1])} m">
    <polygon points="${right} ${left}" fill="var(--chip)" stroke="var(--fg)" stroke-width="1.2"/>
    <text x="4" y="${H_-4}" font-size="10" fill="var(--muted)" font-family="IBM Plex Mono, monospace">${fmt(zs[0])} m</text>
    <text x="4" y="12" font-size="10" fill="var(--muted)" font-family="IBM Plex Mono, monospace">${fmt(zs[zs.length-1])} m</text>
    <text x="${W_-4}" y="${H_-4}" font-size="10" text-anchor="end" fill="var(--muted)" font-family="IBM Plex Mono, monospace">Ø ${fmt(2*rs[0],0)} → ${fmt(2*rs[rs.length-1],0)} cm</text></svg>`;
}
const UTM = (zone)=>({a:6378137,f:1/298.257222101,k0:0.9996,lon0:(zone*6-183)*Math.PI/180,FE:500000});
function utm2ll(E,N,zone){ const {a,f,k0,lon0,FE}=UTM(zone), e2=f*(2-f), ep2=e2/(1-e2);
  const M=N/k0, mu=M/(a*(1-e2/4-3*e2*e2/64-5*e2**3/256)), e1=(1-Math.sqrt(1-e2))/(1+Math.sqrt(1-e2));
  const p1=mu+(3*e1/2-27*e1**3/32)*Math.sin(2*mu)+(21*e1*e1/16-55*e1**4/32)*Math.sin(4*mu)+(151*e1**3/96)*Math.sin(6*mu);
  const C1=ep2*Math.cos(p1)**2, T1=Math.tan(p1)**2, N1=a/Math.sqrt(1-e2*Math.sin(p1)**2), R1=a*(1-e2)/(1-e2*Math.sin(p1)**2)**1.5, D=(E-FE)/(N1*k0);
  const lat=p1-(N1*Math.tan(p1)/R1)*(D*D/2-(5+3*T1+10*C1-4*C1*C1-9*ep2)*D**4/24);
  const lon=lon0+(D-(1+2*T1+C1)*D**3/6)/Math.cos(p1); return [lat*180/Math.PI, lon*180/Math.PI]; }
function select(t){
  sel = t; rebuild(); showPts(t);
  if(!t){ $('card').hidden=true; return; }
  $('cTitle').textContent = (t.name ? t.name : 'Tree ' + t.id);
  $('cTags').innerHTML = t.dbh!=null ? '<span class="tag m">stem measured</span>' : '<span class="tag">stem not visible in scan</span>';
  let rows = [['Height', fmt(t.h)+' m'], ['Crown width', fmt(t.cw)+' m'], ['Crown base', fmt(t.cb)+' m'],
    ['Stem diameter (1.3 m)', t.dbh!=null ? fmt(t.dbh)+' cm' : '–'], ['Points on this tree', t.n.toLocaleString('en-GB')],
    ['Position', fmt(t.x,1)+' / '+fmt(t.y,1)]];
  const z = /258(\d\d)|326(\d\d)/.exec(SITE.crs||'');
  if(z){ const [la,lo] = utm2ll(t.x, t.y, +(z[1]||z[2])); rows.push(['Lat / lon', fmt(la,5)+' / '+fmt(lo,5)]); }
  for(const f of (SITE.extra_fields||[])) if(t[f]!=null) rows.push([f, typeof t[f]==='number'? fmt(t[f],2) : t[f]]);
  $('cVals').innerHTML = rows.map(([k,v])=>`<dt>${k}</dt><dd>${v}</dd>`).join('');
  $('cStem').innerHTML = stemSvg(t);
  $('cNote').textContent = (t.dbh!=null ? 'Stem diameter from circles fitted to the stem points every metre. ' : 'No stem diameter: the scan shows too little of the stem, so the drawn stem is only a placeholder. ')
    + 'Crown shape from this tree\'s own points (90th percentile in each direction).';
  $('card').hidden = false;
}
$('close').onclick = ()=>select(null);

// ---------- controls ----------
function toggle(id, key){ $(id).onclick=()=>{ show[key]=!show[key]; $(id).setAttribute('aria-pressed', show[key]); if(key==='pts'){ showPts(sel); } else if(groups[key]) groups[key].visible=show[key]; }; }
toggle('sCrowns','crowns'); toggle('sStems','stems'); toggle('sPts','pts');
$('colorBy').onchange = rebuild;
$('site').onchange = e=>loadSite(e.target.value);
$('reset').onclick = resetView;
function theme(){ scene.background = new THREE.Color(css('--scene')||'#DCE3D9'); if(trees.length) rebuild(); }
try{ matchMedia('(prefers-color-scheme: dark)').addEventListener('change', theme); }catch(e){}
new MutationObserver(theme).observe(document.documentElement,{attributes:true,attributeFilter:['data-theme']});
function resize(){ renderer.setSize(innerWidth, innerHeight, false); camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix(); }
addEventListener('resize', resize); resize(); theme();
(function loop(){ controls.update(); renderer.render(scene, camera); requestAnimationFrame(loop); })();

(async()=>{
  try{
    INDEX = await getJSON('data/index.json');
    $('site').innerHTML = INDEX.sites.map(s=>`<option value="${s.id}">${s.title}</option>`).join('');
    await loadSite(INDEX.sites[0].id);
  }catch(e){ $('status').textContent = 'Could not load the tree data.'; $('siteInfo').textContent = String(e); }
})();
</script>
